name: HappyMama
options:
  bundleIdPrefix: com.happymama
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

configs:
  Debug: debug
  Local: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_MODULE_NAME: HappyMama
    # Set your team in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: ""
  configs:
    Local:
      # "Local" builds skip CloudKit entirely so the app runs without a paid
      # developer account or an iCloud sign-in. Data stays on the device.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG LOCAL_ONLY"
    Release:
      ONLY_ACTIVE_ARCH: NO

targets:
  HappyMama-iOS:
    type: application
    platform: iOS
    sources: [Shared]
    settings:
      base:
        PRODUCT_NAME: HappyMama
        PRODUCT_BUNDLE_IDENTIFIER: com.happymama.HappyMama
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/iOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: ""
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: Happy Mama
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [remote-notification]
        CKSharingSupported: true
        CloudKitContainerID: iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/iOS.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services: [CloudKit]

  HappyMama-macOS:
    type: application
    platform: macOS
    sources: [Shared]
    settings:
      base:
        PRODUCT_NAME: HappyMama
        PRODUCT_BUNDLE_IDENTIFIER: com.happymama.HappyMama
        # Universal binary: Apple silicon + Intel.
        ARCHS: "$(ARCHS_STANDARD)"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/macOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Local:
          CODE_SIGN_ENTITLEMENTS: ""
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
    info:
      path: Config/macOS-Info.plist
      properties:
        CFBundleDisplayName: Happy Mama
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.lifestyle
        CKSharingSupported: true
        CloudKitContainerID: iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services: [CloudKit]

  HappyMamaTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: HappyMama-macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.happymama.HappyMamaTests
        PRODUCT_MODULE_NAME: HappyMamaTests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HappyMama.app/Contents/MacOS/HappyMama"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  HappyMama-iOS:
    build:
      targets:
        HappyMama-iOS: all
    run:
      config: Debug
  HappyMama-iOS-Local:
    build:
      targets:
        HappyMama-iOS: all
    run:
      config: Local
  HappyMama-macOS:
    build:
      targets:
        HappyMama-macOS: all
    run:
      config: Debug
  HappyMama-macOS-Local:
    build:
      targets:
        HappyMama-macOS: all
    run:
      config: Local
    test:
      config: Local
      targets: [HappyMamaTests]
